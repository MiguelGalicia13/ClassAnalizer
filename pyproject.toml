[project]
name = "classanalizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mike", email = "galiciar319@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "anthropic>=0.52.0",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.1.0",
    "google-genai>=2.19.0",
    "imageio-ffmpeg>=0.5.1",
    "markdown>=3.10.3",
    "numpy>=1.26.0; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12.6; sys_platform == 'win32'",
    "python-dotenv>=1.2.3",
    "pywebview>=6.2.1",
    "pyqt6>=6.11.0; sys_platform != 'win32'",
    "pyqt6-webengine>=6.11.0; sys_platform != 'win32'",
    "qtpy>=2.4.3",
    "rich>=15.0.0",
    "weasyprint>=69.0; sys_platform != 'win32'",
    "xhtml2pdf>=0.2.17; sys_platform == 'win32'",
    "win11toast>=0.36.3; sys_platform == 'win32'",
]

[project.scripts]
classanalizer = "classanalizer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
